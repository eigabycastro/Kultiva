name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    name: Front-end (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    name: API (testes com PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kultiva
          POSTGRES_PASSWORD: kultiva
          POSTGRES_DB: kultiva
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kultiva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kultiva:kultiva@localhost:5432/kultiva?schema=public
      JWT_SECRET: segredo-de-teste-do-ci
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
